[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-data-contracts-platform"
version = "0.1.0"
description = "Batch ELT pipeline platform with declarative data contracts: contract-gated extraction, fail-closed quarantine, SQLite warehouse, DAG transforms, data tests, and run manifests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manas Mohanty" }]
keywords = ["data-engineering", "elt", "data-contracts", "data-quality", "orchestration"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8.0"]

[project.scripts]
elt-demo = "elt_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
